<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6P03DGKQQ5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6P03DGKQQ5');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oneiro: AI Dream Analyzer & Journal</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">

  <meta name="description" content="AI-powered dream analyzer & journal">
  <meta name="keywords" content="dream analyzer, ai dreams">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f4f8;
    }
    .container { max-width: 700px; }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .authed-only { display: none; }
  </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen py-8">
<div class="container bg-white w-full mx-4 p-6 sm:p-8 rounded-2xl shadow-lg">

  <!-- HEADER -->
  <header class="flex justify-between items-center pb-4 border-b">
    <h1 class="text-3xl font-bold">Oneiro</h1>

    <div class="flex items-center gap-3">
      <button id="historyBtn" class="authed-only text-gray-600">📖</button>
      <button id="logoutBtn" class="authed-only text-red-600">⎋</button>
      <img id="userPic" class="authed-only w-8 h-8 rounded-full">
      <button id="loginBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg">
        Login with Google
      </button>
    </div>
  </header>

  <!-- HERO -->
  <div class="text-center mt-6">
    <h2 class="text-xl font-semibold">AI Dream Analyzer</h2>
    <p class="text-gray-600 mt-2">Guest allowed • Login to save history</p>
  </div>

  <!-- INPUT -->
  <div class="mt-8">
    <textarea id="dreamInput" rows="5"
      class="w-full p-3 border rounded-lg"
      placeholder="Describe your dream..."></textarea>
  </div>

  <div class="mt-6 text-center">
    <button id="submitBtn"
      onclick="getInterpretation()"
      class="bg-blue-600 text-white px-8 py-3 rounded-lg">
      Find Meaning
    </button>
  </div>

  <div id="result" class="mt-8"></div>

</div>

<!-- HISTORY MODAL -->
<div id="historyModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
  <div class="bg-white rounded-xl w-full max-w-lg p-4">
    <h2 class="text-xl font-bold mb-2">Dream History</h2>
    <div id="historyList">Login to see history</div>
    <button onclick="document.getElementById('historyModal').classList.add('hidden')" class="mt-4">Close</button>
  </div>
</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

<script>
/* ---------------- FIREBASE CONFIG ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyA_eqoKj8Mv6gnS7dGfuZ-X6LmSrCDDhCg",
  authDomain: "oneiro-b79d9.firebaseapp.com",
  projectId: "oneiro-b79d9",
  storageBucket: "oneiro-b79d9.appspot.com",
  messagingSenderId: "288643438849",
  appId: "1:288643438849:web:ca388425439c1ff3476300"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

/* ---------------- GLOBAL STATE ---------------- */
let currentUserId = null;
let unsubscribeHistory = null;

/* ---------------- AUTH PERSISTENCE ---------------- */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* ---------------- AUTH STATE ---------------- */
auth.onAuthStateChanged(user => {
  const authed = document.querySelectorAll('.authed-only');

  if (user) {
    currentUserId = user.uid;
    authed.forEach(e => e.style.display = 'inline-block');
    loginBtn.style.display = 'none';
    if (user.photoURL) userPic.src = user.photoURL;
    listenToHistory(user.uid);
  } else {
    currentUserId = null;
    authed.forEach(e => e.style.display = 'none');
    loginBtn.style.display = 'inline-block';
    if (unsubscribeHistory) unsubscribeHistory();
  }
});

/* ---------------- LOGIN / LOGOUT ---------------- */
loginBtn.onclick = () => auth.signInWithRedirect(provider);
logoutBtn.onclick = () => auth.signOut();
historyBtn.onclick = () =>
  document.getElementById('historyModal').classList.remove('hidden');

</script>
<script>
/* ---------------- HISTORY (FIRESTORE) ---------------- */

function listenToHistory(uid) {
  unsubscribeHistory = db
    .collection("users")
    .doc(uid)
    .collection("dreams")
    .orderBy("id", "desc")
    .onSnapshot(snapshot => {
      const data = [];
      snapshot.forEach(doc => data.push(doc.data()));
      renderHistoryList(data);
    });
}

function renderHistoryList(list) {
  if (!list.length) {
    historyList.innerHTML = "<p class='text-gray-500'>No dreams saved yet.</p>";
    return;
  }

  historyList.innerHTML = list.map(d => `
    <div class="border p-3 rounded mb-2 cursor-pointer">
      <h4 class="font-semibold text-blue-600">${d.title}</h4>
      <p class="text-xs text-gray-500">${d.date}</p>
    </div>
  `).join("");
}

async function saveHistory(entry) {
  if (!currentUserId) return; // 👈 guest = no save
  await db
    .collection("users")
    .doc(currentUserId)
    .collection("dreams")
    .doc(entry.id.toString())
    .set(entry);
}

/* ---------------- GEMINI API ---------------- */

async function getInterpretation() {
  const dream = dreamInput.value.trim();
  if (!dream) {
    alert("Please write your dream first 🙂");
    return;
  }

  result.innerHTML = `<div class="loader"></div>`;

  const apiKey = "AIzaSyCWUir05ATgwpAVP8tH6tbhVQAYBgO4_dA";
  const API_URL =
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

  const prompt = `
Analyze the following dream: "${dream}"

Detect the language automatically and reply in the same language.

Use exact headings:
## TITLE
## SPIRITUAL ANALYSIS
## SCIENTIFIC ANALYSIS
`;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const json = await res.json();
    const text = json.candidates[0].content.parts[0].text;

    parseAndShow(text, dream);
  } catch (e) {
    result.innerHTML = `<p class="text-red-600">Error: ${e.message}</p>`;
  }
}

/* ---------------- PARSE RESULT ---------------- */

function parseAndShow(content, dreamText) {
  let title = "Dream";
  let spiritual = "";
  let scientific = "";

  try {
    title = content.split("## TITLE")[1]
      .split("## SPIRITUAL")[0].trim();
    spiritual = content.split("## SPIRITUAL ANALYSIS")[1]
      .split("## SCIENTIFIC")[0].trim();
    scientific = content.split("## SCIENTIFIC ANALYSIS")[1].trim();
  } catch {
    scientific = content;
  }

  const entry = {
    id: Date.now(),
    date: new Date().toDateString(),
    title,
    dream: dreamText,
    spiritual,
    scientific
  };

  saveHistory(entry);
  showResult(entry);
  dreamInput.value = "";
}

/* ---------------- DISPLAY RESULT ---------------- */

function showResult(entry) {
  result.innerHTML = `
    <div class="bg-gray-50 border rounded-lg p-4 mb-4">
      <h3 class="font-bold mb-2">Spiritual Analysis</h3>
      <p class="whitespace-pre-wrap">${entry.spiritual}</p>
    </div>

    <div class="bg-gray-50 border rounded-lg p-4">
      <h3 class="font-bold mb-2">Scientific Analysis</h3>
      <p class="whitespace-pre-wrap">${entry.scientific}</p>
    </div>

    <div class="mt-4 text-sm text-gray-600 italic">
      "${entry.dream}"
    </div>
  `;
}
</script>

</body>
</html>
